[package]
name = "siphon"
version = "0.5.1"
description = "A universal video downloader built on yt-dlp"
authors = ["Iosif Christogeorgos"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset serves the trim preview's cached proxy file to the webview.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "fs", "sync", "time", "macros", "rt-multi-thread"] }
# native-tls uses the OS TLS stack (SChannel / Secure Transport): smaller binary, no C toolchain extras.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "json", "stream"] }
futures-util = "0.3"
sha2 = "0.11"
hex = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
