[package]
name = "siphon"
version = "0.11.0"
description = "A universal video downloader built on yt-dlp"
authors = ["Iosif Christogeorgos"]
license = "GPL-3.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset serves the trim preview's cached proxy file to the webview.
# unstable: windows with more than one webview, for the sign-in window (Siphon's bar above the site's page).
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "fs", "sync", "time", "macros", "rt-multi-thread", "net"] }
# native-tls uses Windows' own TLS stack (SChannel): smaller binary, no C toolchain extras.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "json", "stream"] }
futures-util = "0.3"
sha2 = "0.11"
hex = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
thiserror = "2"
# Reads Windows' proxy settings, so downloads keep using the system proxy.
winreg = "0.56"
tauri-plugin-single-instance = "2"
# "Download finished" when Siphon isn't the active window. Used from Rust only (`commands::notify`).
tauri-plugin-notification = "2"
# Which site a link belongs to (youtube.com for music.youtube.com), so sign-in cookies go only to their own site.
psl = "2"
# DPAPI: sign-in cookies are encrypted for the current Windows user.
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[dev-dependencies]
# Paused time, for testing the speed limit without waiting for it.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
